<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация Игрока Tacticus</title>
    <script src="https://telegram.org"></script>
    <style>
        /* Стили идентичны первому файлу для сохранения нативного дизайна Telegram */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 400px; }
        h2 { font-size: 20px; margin-bottom: 10px; color: var(--tg-theme-hint-color, #707579); }
        p { font-size: 14px; line-height: 1.4; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-size: 14px; font-weight: bold; margin-bottom: 6px; }
        input {
            padding: 12px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000000);
            font-size: 14px;
        }
        input:focus { outline: 2px solid var(--tg-theme-button-color, #2481cc); }
        button {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        button:active { opacity: 0.8; }
        .hint { font-size: 12px; color: var(--tg-theme-hint-color, #707579); margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Регистрация Профиля</h2>
        <p>Пройдите верификацию, чтобы бот связал ваш Telegram-аккаунт с игровым персонажем в клане.</p>

        <!-- Поле 1: User ID из игры -->
        <div class="form-group">
            <label for="user-id">Ваш User ID из игры</label>
            <input type="text" id="user-id" placeholder="Например: 5461ba9f-a1df-...">
            <div class="hint">Скопируйте в самом низу настроек внутри Tacticus</div>
        </div>

        <!-- Поле 2: Личный Player API Токен -->
        <div class="form-group">
            <label for="token">Player API Token</label>
            <input type="text" id="token" placeholder="Вставьте ваш личный токен...">
            <div class="hint">Сгенерируйте на ://tacticusgame.com с правами Player read</div>
        </div>

        <button id="submit-btn">Верифицировать аккаунт</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chat_id');

        document.getElementById('submit-btn').addEventListener('click', () => {
            const userIdValue = document.getElementById('user-id').value.trim();
            const tokenValue = document.getElementById('token').value.trim();

            if (!userIdValue || !tokenValue) {
                alert('Пожалуйста, заполните оба поля!');
                return;
            }

            if (!chatId) {
                alert('Ошибка: Контекст клан-чата потерян.');
                return;
            }

            // Формируем структуру данных игрока
            const dataToSend = {
                type: "player",
                chat_id: chatId,
                user_id: userIdValue,
                token: tokenValue
            };

            // Отправляем JSON обратно боту
            tg.sendData(JSON.stringify(dataToSend));

            // Закрываем окно
            tg.close();
        });
    </script>
</body>
</html>
