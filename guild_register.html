<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация Гильдии Tacticus</title>
    <!-- Подключаем официальный скрипт Telegram WebApp -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 10px;
            color: var(--tg-theme-hint-color, #707579);
        }
        p {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        input {
            padding: 12px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000000);
            font-size: 14px;
        }
        input:focus {
            outline: 2px solid var(--tg-theme-button-color, #2481cc);
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Регистрация Клана</h2>
        <p>Вставьте ваш API-токен гильдии, сгенерированный на сайте <b>://tacticusgame.com</b> с правами <code>Guild read</code>.</p>

        <div class="form-group">
            <label for="token">Guild API Token</label>
            <input type="text" id="token" placeholder="Вставьте длинный токен гильдии...">
        </div>

        <button id="submit-btn">Сохранить и привязать чат</button>
    </div>

    <script>
        // Код запускается сразу, без ожидания DOMContentLoaded
        try {
            // Находим нашу кнопку по ID
            const submitBtn = document.getElementById('submit-btn');

            submitBtn.addEventListener('click', () => {
                try {
                    // Проверяем наличие SDK Телеграма прямо в момент клика по кнопке
                    if (!window.Telegram || !window.Telegram.WebApp) {
                        alert('⚠️ Ошибка: Telegram WebApp SDK еще не загрузился. Пожалуйста, подождите 2 секунды и нажмите кнопку снова.');
                        return;
                    }

                    const tg = window.Telegram.WebApp;
                    tg.expand(); // Расширяем шторку на всякий случай

                    // Считываем параметры из адресной строки
                    const urlParams = new URLSearchParams(window.location.search);
                    const chatId = urlParams.get('chat_id');
                    const tokenValue = document.getElementById('token').value.trim();

                    if (!tokenValue) {
                        alert('⚠️ Пожалуйста, вставьте ваш Guild токен!');
                        return;
                    }

                    if (!chatId) {
                        alert('⚠️ Критическая ошибка: в адресе страницы отсутствует параметр chat_id. Перезапустите WebApp через бота.');
                        return;
                    }

                    // Формируем JSON структуру
                    const dataToSend = {
                        type: "guild",
                        chat_id: chatId,
                        token: tokenValue
                    };

                    // Отправляем обратно в Python-код бота
                    tg.sendData(JSON.stringify(dataToSend));

                    // Закрываем шторку WebApp
                    tg.close();

                } catch (clickError) {
                    alert('Ошибка при выполнении отправки: ' + clickError.message);
                }
            });

        } catch (initError) {
            alert('Критическая ошибка инициализации: ' + initError.message);
        }
    </script>
</body>
</html>
